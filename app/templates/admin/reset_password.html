<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password — CCKAFWEARS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h2 style="margin-top:0;">Reset Admin Password</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="field">
        <label>Admin username</label>
        <input type="text" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label>Reset token</label>
        <input type="password" name="reset_token" required autocomplete="off">
      </div>
      <div class="field">
        <label>New password</label>
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Reset password</button>
    </form>
    <p style="text-align:center;margin:18px 0 0;"><a href="{{ url_for('admin.login') }}">Back to login</a></p>
  </div>
</div>
</body>
</html>
