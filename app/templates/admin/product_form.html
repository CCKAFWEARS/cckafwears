{% extends "admin/base.html" %}
{% block content %}
<div class="topbar"><h1>{{ "Edit dress" if product else "Add a new dress" }}</h1></div>

<div class="card-panel" style="max-width:640px;">
  <form method="POST" enctype="multipart/form-data">
    <div class="field">
      <label>Dress name</label>
      <input type="text" name="name" value="{{ product.name if product else '' }}" required>
    </div>

    <div class="field">
      <label>Description</label>
      <textarea name="description" rows="3">{{ product.description if product else '' }}</textarea>
    </div>

    <div class="form-grid">
      <div class="field">
        <label>Price (GHS)</label>
        <input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required>
      </div>
      <div class="field">
        <label>Stock count (only you see this)</label>
        <input type="number" name="stock" value="{{ product.stock if product else 0 }}" required>
      </div>
    </div>

    <div class="field">
      <label>Category</label>
      <select name="category_id">
        <option value="">No category</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Photo</label>
      <input type="file" name="image" accept="image/*">
      {% if product and product.image_filename %}
        <img class="thumb" style="margin-top:8px;width:70px;height:88px;" src="{{ url_for('static', filename='uploads/' + product.image_filename) }}">
      {% endif %}
    </div>

    <div class="form-grid">
      <div class="field">
        <label>Discount % (0 = no discount)</label>
        <input type="number" step="1" min="0" max="100" name="discount_percent" value="{{ product.discount_percent if product else 0 }}">
      </div>
      <div class="field">
        <label>Flash sale ends at (optional)</label>
        <input type="datetime-local" name="flash_sale_ends_at" value="{{ product.flash_sale_ends_at.strftime('%Y-%m-%dT%H:%M') if product and product.flash_sale_ends_at else '' }}">
      </div>
    </div>

    <div class="field checkbox-row">
      <input type="checkbox" id="is_flash_sale" name="is_flash_sale" {% if product and product.is_flash_sale %}checked{% endif %}>
      <label for="is_flash_sale" style="margin:0;">Mark as flash sale</label>
    </div>

    {% if product %}
    <div class="field checkbox-row">
      <input type="checkbox" id="is_active" name="is_active" {% if product.is_active %}checked{% endif %}>
      <label for="is_active" style="margin:0;">Visible in shop (uncheck to hide manually)</label>
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary">{{ "Save changes" if product else "Add dress" }}</button>
    <a href="{{ url_for('admin.products') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
