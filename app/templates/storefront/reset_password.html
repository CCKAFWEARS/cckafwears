{% extends "storefront/base.html" %}
{% block title %}Reset password — CCKAFWEARS{% endblock %}
{% block content %}
<section class="section"><div class="wrap" style="max-width:560px">
  <div class="section-head"><h2>Reset password</h2></div>
  <form method="POST">
    <div class="field"><label>Email address</label><input type="email" name="email" value="{{ email }}" required></div>
    <div class="field"><label>6-digit reset code</label><input type="text" name="code" inputmode="numeric" maxlength="6" required></div>
    <div class="field"><label>New password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Reset password</button>
  </form>
</div></section>
{% endblock %}
