{% extends "storefront/base.html" %}
{% block title %}Forgot password — CCKAFWEARS{% endblock %}
{% block content %}
<section class="section"><div class="wrap" style="max-width:560px">
  <div class="section-head"><h2>Forgot password?</h2></div>
  <p>Enter your account email and we'll send a reset code.</p>
  <form method="POST">
    <div class="field"><label>Email address</label><input type="email" name="email" required autocomplete="email"></div>
    <button class="btn btn-primary btn-block" type="submit">Send reset code</button>
  </form>
</div></section>
{% endblock %}
