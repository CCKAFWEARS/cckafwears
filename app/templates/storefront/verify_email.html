{% extends "storefront/base.html" %}
{% block title %}Confirm phone — CCKAFWEARS{% endblock %}
{% block content %}
<section class="section"><div class="wrap" style="max-width:560px">
  <div class="section-head"><h2>Confirm your phone</h2></div>
  <p>We sent a 6-digit confirmation code to your phone by SMS. Enter it below to activate your customer account.</p>
  <form method="POST">
    <div class="field"><label>SMS confirmation code</label><input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="123456"></div>
    <button class="btn btn-primary btn-block" type="submit">Confirm phone</button>
  </form>
  <form method="POST" action="{{ url_for('storefront.resend_verification') }}" style="margin-top:12px"><button class="btn btn-block" type="submit">Send a new code</button></form>
</div></section>
{% endblock %}
