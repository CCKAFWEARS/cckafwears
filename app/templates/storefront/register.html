{% extends "storefront/base.html" %}
{% block title %}Create account — CCKAFWEARS{% endblock %}
{% block content %}
<section class="section"><div class="wrap" style="max-width:560px">
  <div class="section-head"><h2>Create your account</h2></div>
  <p>Create an account with your Gmail address and a password.</p>
  <form method="POST">
    <div class="field"><label>Full name</label><input type="text" name="name" required autocomplete="name"></div>
    <div class="field"><label>Gmail address</label><input type="email" name="email" required autocomplete="email" placeholder="you@gmail.com"></div>
    <div class="field"><label>Password</label><input type="password" name="password" required minlength="8" autocomplete="new-password"><small>Use at least 8 characters.</small></div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p style="margin-top:16px">Already have an account? <a href="{{ url_for('storefront.login') }}">Log in</a></p>
</div></section>
{% endblock %}
